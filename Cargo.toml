[package]
name = "recordo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Screen recordings with a cursor-following camera"
repository = "https://github.com/waarispierre/recordo"
homepage = "https://github.com/waarispierre/recordo"
readme = "README.md"
keywords = ["screen-recording", "screencast", "macos", "demo", "tui"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal interface.
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dialoguer = { version = "0.12", default-features = false }
indicatif = "0.18"
owo-colors = "4"
ratatui = "0.30"

# Rendering and encoding.
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl"] }

# Settings and paths.
ctrlc = "3"
dirs = "6"
toml = "0.9"
toml_edit = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
foreign-types = "0.5"
mach2 = "0.5"
# macos_15_0 gates SCRecordingOutput (direct stream-to-file).
screencapturekit = { version = "10", features = ["macos_15_0"] }
