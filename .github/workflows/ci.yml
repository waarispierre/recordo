name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs exactly what `go run ./ci` runs on a laptop, so green here and green there mean the
# same thing. CI is set by GitHub, which makes the runner treat a missing tool as a
# failure rather than skipping the check.
jobs:
  ci:
    # macOS 15: recording writes through ScreenCaptureKit's SCRecordingOutput, which macOS
    # 15 introduced, and the cgo build compiles against that SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install check tooling
        run: brew install shellcheck

      - name: Run CI
        run: go run ./ci
