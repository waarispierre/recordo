name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs run the same program as `go run ./ci` does locally, so a green run here and
# a green run on a laptop mean the same thing.
#
# They are split by necessity rather than preference: the portable half needs a container
# runtime, which GitHub's macOS runners do not provide, and the native half needs macOS,
# which no container can offer.
jobs:
  portable:
    name: portable checks (Dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ci/go.sum

      # Formatting, licences, dependency policy and shell linting, all in containers.
      - run: go run ./ci -only=portable

  native:
    name: native checks (macOS)
    # macOS 15: the capture path uses SCRecordingOutput, which is not available earlier.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ci/go.sum

      # Clippy, tests, release build, and the assertion that the built binary has no
      # path to the network.
      - run: go run ./ci -only=native
