name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs exactly what `go run ./ci` runs on a laptop, so green here and green there mean
# the same thing. CI is set by GitHub, which makes the runner treat a missing tool as a
# failure rather than skipping the check.
jobs:
  ci:
    # recordo compiles only on macOS, and macOS 15 specifically: the capture path uses
    # SCRecordingOutput, which is not available earlier.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install check tooling
        run: |
          cargo install cargo-deny --locked
          brew install shellcheck

      - name: Run CI
        run: go run ./ci
